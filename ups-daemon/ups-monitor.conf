# /etc/ups-monitor.conf — Waveshare UPS Power Module (C) 监控配置 (nx3)
# 修改后: sudo systemctl restart ups-monitor

# ---- I2C ----
bus = 7
addr = 0x41

# ---- 采样与滤波 ----
interval = 2.0
ema_alpha = 0.25
deadband_ma = 120.0
battery_confirm = 5
ac_confirm = 3

# ---- 电压阈值 (3S Li-ion: 9.0V=0% / 12.6V=100%) ----
# warn 10.8V ≈ 50%   低电预警
# low  10.2V ≈ 33%   降功耗 + 疏散
# shutdown 9.9V ≈ 25% 有序关机
# crit 9.3V          急停
warn_v = 10.8
low_v = 10.2
shutdown_v = 9.9
crit_v = 9.3

shutdown_sustain = 8
crit_sustain = 2

# ---- 低电时的降功耗动作 (nvpmodel: 0=MAXN_SUPER 1=10W 2=15W 3=25W 4=40W) ----
low_power_mode = 1

# ---- 钩子目录 ----
hook_dir = /usr/local/lib/ups-monitor/pre-shutdown.d
low_dir = /usr/local/lib/ups-monitor/low-battery.d
hook_timeout = 20

# ---- 状态输出 ----
state_file = /run/ups-monitor/status.json

# ---- 传感器故障策略 ----
# 0 = I2C 丢失时不关机(默认)。1 = 丢失也关机。
# 依据: 电池模式下关机后必须现场按电源键, 误关机代价高于晚关机。
sensor_lost_limit = 15
shutdown_on_sensor_loss = 0

# ---- 干跑: 1 = 只记录不关机 ----
dry_run = 1

# ---- 可选通知: 收到 JSON 于 stdin 的命令 ----
# 例: notify_cmd = curl -s -d @- http://192.168.100.10:8080/ups
notify_cmd =

# ---- 可选 HTTP 预览页 ----
http_enabled = 0
http_bind = 0.0.0.0
http_port = 8088
